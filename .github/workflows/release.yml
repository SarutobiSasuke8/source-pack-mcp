name: Release package artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke:mcp
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: source-pack-mcp-${{ github.ref_name }}
          path: "*.tgz"
          if-no-files-found: error
