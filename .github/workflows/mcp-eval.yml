name: mcp-eval

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mcp-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Harness pinned to the main squash-merge commit of mcp-eval-harness #6. Keep this SHA
      # in step with the package.json devDependency pin.
      - uses: SarutobiSasuke8/mcp-eval-harness@c33df1c081ec871a7fbc294af87052bfeabb6b24
        with:
          suite: eval/mcp.suite.yaml
          node-version: ""
